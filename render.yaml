services:
  - type: web
    name: ai-hiring-platform
    runtime: docker
    dockerfilePath: Dockerfile
    healthCheckPath: /api/auth/me
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SUPER_ADMIN_EMAIL
        value: admin@aihiring.com
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.1-flash-live-preview
      - key: GEMINI_LIVE_VOICE
        value: Leda
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: AI Hiring Platform
      - key: FRONTEND_URL
        value: https://interviewai-zjoo.onrender.com
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SENDGRID_API_KEY
        sync: false
      - key: SHORTLIST_THRESHOLD
        value: "80"
      - key: OCR_CONCURRENCY
        value: "3"
      - key: OCR_ENABLED
        value: "true"
      - key: OCR_MAX_FILE_MB
        value: "10"
      - key: OCR_MAX_PAGES
        value: "10"
      - key: OCR_MEDIA_RESOLUTION
        value: MEDIA_RESOLUTION_MEDIUM
      - key: OCR_TIMEOUT_SECONDS
        value: "60"
      - key: RESUME_JOB_LEASE_SECONDS
        value: "300"
      - key: RESUME_JOB_TTL_HOURS
        value: "24"
